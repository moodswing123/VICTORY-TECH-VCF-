<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory Tech - Multi VCF Generator</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #111;
            border: 2px solid #00ff41;
            border-radius: 12px;
            padding: 40px;
            max-width: 950px;
            width: 100%;
            box-shadow: 0 0 50px rgba(0,255,65,0.15);
        }
        h1 {
            text-align: center;
            font-size: 26px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #00ff41;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #00cc33;
            font-size: 13px;
            margin-bottom: 25px;
            opacity: 0.7;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #00ff41;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .stats span { color: #66ff88; font-weight: bold; }
        .contact-entry {
            background: #1a1a1a;
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .contact-entry input {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            background: #0a0a0a;
            border: 1px solid #00ff41;
            border-radius: 4px;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            outline: none;
        }
        .contact-entry input:focus {
            box-shadow: 0 0 15px rgba(0,255,65,0.2);
        }
        .contact-entry .remove-btn {
            background: transparent;
            border: 1px solid #ff0040;
            color: #ff0040;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            transition: 0.3s;
        }
        .contact-entry .remove-btn:hover {
            background: #ff0040;
            color: #0a0a0a;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .actions button {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: transparent;
            border: 2px solid #00ff41;
            border-radius: 6px;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .actions button:hover {
            background: #00ff41;
            color: #0a0a0a;
        }
        .actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .actions button.danger {
            border-color: #ff0040;
            color: #ff0040;
        }
        .actions button.danger:hover {
            background: #ff0040;
            color: #0a0a0a;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #1a1a1a;
            border: 1px solid #00ff41;
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: #00ff41;
            transition: width 0.5s;
            width: 0%;
            box-shadow: 0 0 20px rgba(0,255,65,0.3);
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: #0a0a0a;
            text-shadow: 0 0 10px #00ff41;
        }
        .preview {
            margin-top: 20px;
            padding: 14px;
            background: #0d0d0d;
            border: 1px dashed #00ff41;
            border-radius: 6px;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }
        .preview.show { display: block; }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            text-align: center;
            opacity: 0.4;
            letter-spacing: 1px;
        }
        .lock-icon { color: #ff0040; font-size: 18px; }
        .unlock-icon { color: #00ff41; font-size: 18px; }
        .status-msg {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
            text-align: center;
        }
        .status-msg.success { 
            background: #003300; 
            border: 1px solid #00ff41;
            display: block;
        }
        .status-msg.error { 
            background: #330000; 
            border: 1px solid #ff0040;
            display: block;
            color: #ff6666;
        }
        .status-msg.info { 
            background: #001133; 
            border: 1px solid #0066ff;
            display: block;
            color: #66aaff;
        }
        .db-status {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⬡ VICTORY TECH VCF</h1>
    <div class="sub">💀 Global database — 500 contacts required to unlock 💀</div>

    <div class="stats">
        <div>📊 Contacts: <span id="contactCount">0</span> / 500</div>
        <div>🔒 Status: <span id="statusText" class="lock-icon">🔒 LOCKED</span></div>
        <div>🔄 <span id="dbStatus" class="db-status">Database: Ready</span></div>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <div id="contactsContainer">
        <div style="text-align:center; padding:30px; opacity:0.5; border:1px dashed #00ff41; border-radius:8px;">
            No contacts yet. Click "ADD CONTACT" to start building.<br>
            Need 500 to unlock download.
        </div>
    </div>

    <div class="actions">
        <button id="addContactBtn">➕ ADD CONTACT</button>
        <button id="downloadBtn" disabled>⬇ DOWNLOAD VCF (LOCKED)</button>
        <button id="clearBtn" class="danger">🗑 CLEAR ALL</button>
        <button id="pushBtn" style="border-color:#ffaa00; color:#ffaa00;">📤 PUSH TO DATABASE</button>
    </div>

    <div class="preview" id="preview"></div>
    <div class="footer">🔻 Contacts stored locally. Click "PUSH TO DATABASE" to save globally.</div>
</div>

<script>
// ============================================================
// VICTORY TECH - LOCAL FIRST, PUSH TO DATABASE
// Contacts stored locally, only push when user clicks button
// ============================================================

const BIN_ID = '6a844f26da38895dfef2a19c';
const API_KEY = '$2a$10$gJCF2Mb.77rKvpyh3UnBvOGondXhWIM9VVAw8tYpurfOP7smuUBTW';

let contacts = [];
let isLoading = false;

// Show status message
function showStatus(message, type = 'info') {
    const el = document.getElementById('statusMsg');
    el.textContent = message;
    el.className = 'status-msg ' + type;
    el.style.display = 'block';
    setTimeout(() => {
        if (el.className === 'status-msg ' + type) {
            el.style.display = 'none';
        }
    }, 5000);
}

// Load from localStorage only (not from database)
function loadLocalContacts() {
    const saved = localStorage.getItem('victoryTechContacts');
    contacts = saved ? JSON.parse(saved) : [];
    renderContacts();
    updateUI();
    document.getElementById('dbStatus').textContent = 'Database: Local only (push to save)';
    showStatus('📂 Loaded contacts from local storage', 'info');
}

// Push contacts to database (manual)
async function pushToDatabase() {
    if (contacts.length === 0) {
        showStatus('❌ No contacts to push', 'error');
        return;
    }
    
    document.getElementById('dbStatus').textContent = 'Database: Pushing...';
    showStatus('⏳ Pushing contacts to database...', 'info');
    
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': API_KEY
            },
            body: JSON.stringify(contacts)
        });
        
        if (response.ok) {
            document.getElementById('dbStatus').textContent = 'Database: Pushed ✅';
            showStatus(`✅ Successfully pushed ${contacts.length} contacts to database!`, 'success');
        } else {
            throw new Error(`Push failed: ${response.status}`);
        }
    } catch (error) {
        console.error('Push error:', error);
        document.getElementById('dbStatus').textContent = 'Database: Push failed ❌';
        showStatus('❌ Failed to push to database. Check API key and bin ID.', 'error');
    }
}

// Add a new contact
function addContact(name = '', phone = '') {
    contacts.push({ name, phone });
    localStorage.setItem('victoryTechContacts', JSON.stringify(contacts));
    renderContacts();
    updateUI();
    showStatus(`✅ Added contact (${contacts.length}/500)`, 'success');
    const container = document.getElementById('contactsContainer');
    container.scrollTop = container.scrollHeight;
}

// Remove a contact
function removeContact(index) {
    contacts.splice(index, 1);
    localStorage.setItem('victoryTechContacts', JSON.stringify(contacts));
    renderContacts();
    updateUI();
    showStatus(`🗑 Removed contact (${contacts.length}/500)`, 'info');
}

// Clear all contacts
function clearAll() {
    if (contacts.length === 0) return;
    if (confirm('⚠️ Delete ALL local contacts? This does NOT affect the database until you push.')) {
        contacts = [];
        localStorage.setItem('victoryTechContacts', JSON.stringify(contacts));
        renderContacts();
        updateUI();
        showStatus('🗑 All local contacts deleted', 'error');
    }
}

// Render contacts
function renderContacts() {
    const container = document.getElementById('contactsContainer');
    if (contacts.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:30px; opacity:0.5; border:1px dashed #00ff41; border-radius:8px;">
                No contacts locally. Click "ADD CONTACT" to start building.<br>
                Need 500 to unlock download.
            </div>
        `;
        return;
    }

    let html = '';
    contacts.forEach((contact, index) => {
        const name = contact.name || '';
        const phone = contact.phone || '';
        html += `
            <div class="contact-entry">
                <input type="text" placeholder="Full Name" value="${escapeHtml(name)}" 
                       onchange="updateContact(${index}, 'name', this.value)">
                <input type="text" placeholder="Phone Number" value="${escapeHtml(phone)}" 
                       onchange="updateContact(${index}, 'phone', this.value)">
                <button class="remove-btn" onclick="removeContact(${index})">✕</button>
            </div>
        `;
    });
    container.innerHTML = html;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function updateContact(index, field, value) {
    if (index >= 0 && index < contacts.length) {
        contacts[index][field] = value;
        localStorage.setItem('victoryTechContacts', JSON.stringify(contacts));
        updateUI();
    }
}

function updateUI() {
    const count = contacts.length;
    const isUnlocked = count >= 500;
    
    document.getElementById('contactCount').textContent = count;
    
    const progress = Math.min((count / 500) * 100, 100);
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressText').textContent = Math.round(progress) + '%';
    
    const statusText = document.getElementById('statusText');
    const downloadBtn = document.getElementById('downloadBtn');
    
    if (isUnlocked) {
        statusText.innerHTML = '<span class="unlock-icon">🔓 UNLOCKED</span>';
        downloadBtn.disabled = false;
        downloadBtn.textContent = '⬇ DOWNLOAD VCF (UNLOCKED)';
    } else {
        statusText.innerHTML = `<span class="lock-icon">🔒 LOCKED (${count}/500)</span>`;
        downloadBtn.disabled = true;
        downloadBtn.textContent = `⬇ DOWNLOAD VCF (${count}/500)`;
    }
}

function generateVCF() {
    if (contacts.length < 500) {
        alert(`❌ Need ${500 - contacts.length} more contacts to unlock.`);
        return null;
    }

    let vcf = '';
    contacts.forEach(contact => {
        const name = contact.name.trim() || 'Unknown';
        const phone = contact.phone.trim() || '+0000000000';
        
        vcf += 'BEGIN:VCARD\n';
        vcf += 'VERSION:3.0\n';
        vcf += `FN:${name}\n`;
        vcf += `N:${name.split(' ').reverse().join(';')};;;\n`;
        vcf += `TEL;TYPE=CELL:${phone}\n`;
        vcf += 'END:VCARD\n';
    });
    
    return vcf;
}

function downloadVCF() {
    const vcfData = generateVCF();
    if (!vcfData) return;
    
    const preview = document.getElementById('preview');
    preview.textContent = vcfData;
    preview.classList.add('show');
    
    const blob = new Blob([vcfData], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `VICTORY_TECH_${contacts.length}_CONTACTS.vcf`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
    
    showStatus(`✅ VCF downloaded with ${contacts.length} contacts!`, 'success');
}

// Event listeners
document.addEventListener('DOMContentLoaded', function() {
    loadLocalContacts();
    
    document.getElementById('addContactBtn').addEventListener('click', function() {
        addContact('', '');
    });
    
    document.getElementById('downloadBtn').addEventListener('click', downloadVCF);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('pushBtn').addEventListener('click', pushToDatabase);
    
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('addContactBtn').click();
        }
    });
});

// Auto-save to localStorage on any change (already done in functions)
</script>
</body>
</html>
